version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      release-tooling:
        patterns:
          - "*"
    ignore:
      # 10.x needs conventional-changelog-writer 9, which the release notes
      # generator bundled with semantic-release 25 does not load yet.
      - dependency-name: conventional-changelog-conventionalcommits
        versions: [">=10"]

