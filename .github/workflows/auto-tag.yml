name: Auto Tag

on:
  pull_request_target:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag merged pull request
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Create merge tag
        id: tag
        env:
          COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ ! "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid merged commit SHA: ${COMMIT_SHA}" >&2
            exit 1
          fi
          git merge-base --is-ancestor "${COMMIT_SHA}" refs/remotes/origin/master
          release_line=$(tr -d '[:space:]' <release-line.txt)
          [[ ${release_line} =~ ^[0-9]+\.[0-9]+$ ]]
          base_tag="v${release_line}"
          patch=-1
          while IFS= read -r existing_tag; do
            existing_patch=${existing_tag#"${base_tag}."}
            [[ ${existing_patch} =~ ^[0-9]+$ ]] || continue
            existing_patch=$((10#${existing_patch}))
            ((existing_patch > patch)) && patch=${existing_patch}
          done < <(git tag --list "${base_tag}.*")
          tag="${base_tag}.$((patch + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${COMMIT_SHA}" -m "Atrinik content ${tag}"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

  release:
    name: Queue release
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          for attempt in {1..6}; do
            if gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" \
                --ref master --field "tag=${RELEASE_TAG}"; then
              exit 0
            fi
            ((attempt < 6)) || exit 1
            sleep 5
          done

