name: Check

on:
  push:
    branches:
      - main
      - 1.x
  pull_request:
    branches:
      - main
      - 1.x

permissions:
  contents: read

jobs:
  content-validation:
    name: Content validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate content and runtime collection
        run: python3 tools/validate.py

      - name: Ensure collection leaves sources clean
        run: test -z "$(git status --short)"

  syntax-prototypes:
    name: Syntax prototypes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Exercise bounded YAML and JSONC prototypes
        run: python -m unittest tools.tests.test_syntax_evaluation

      - name: Verify authoritative schema projections
        run: python -m unittest tools.tests.test_content_schema

      - name: Exercise lossless content core and safe transactions
        run: python -m unittest tools.tests.test_content_core
