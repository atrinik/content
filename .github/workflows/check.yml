name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  content-validation:
    name: Content validation
    runs-on: ubuntu-24.04
    # Full-history/LFS checkout, corpus validation, and cleanup share this budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Validate content and runtime collection
        run: python3 tools/validate.py

      - name: Ensure collection leaves sources clean
        run: test -z "$(git status --short)"

  release-safety:
    name: Release safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1

      - name: Verify locked release tooling installs
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release policy and publication safety
        run: |
          node scripts/release/test-release-policy.cjs
          node scripts/release/test-release-safety.cjs

  syntax-prototypes:
    name: Syntax prototypes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Exercise bounded YAML and JSONC prototypes
        run: python -m unittest tools.tests.test_syntax_evaluation

      - name: Verify authoritative schema projections
        run: python -m unittest tools.tests.test_content_schema

      - name: Exercise lossless content core and safe transactions
        run: python -m unittest tools.tests.test_content_core
