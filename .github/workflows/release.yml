name: Semantic Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install locked release tooling
        run: npm ci
      - name: Verify release policy and publication safety
        run: |
          node scripts/release/test-release-policy.cjs
          node scripts/release/test-release-safety.cjs
      - name: Analyze commits and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release
